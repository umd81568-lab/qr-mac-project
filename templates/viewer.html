<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      .viewer-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .toolbar {
        padding: 0.75rem 1rem;
        background: #111827;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      iframe {
        border: 0;
        flex: 1;
        width: 100%;
      }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <div class="viewer-shell">
      <div class="toolbar">
        <div>{{ link.domain }}/{{ link.path_pattern }}</div>
        <a href="{{ url_for('serve_pdf_file', link_id=link.id, download=1) }}">Download PDF</a>
      </div>
      <iframe src="{{ viewer_url }}" title="PDF Viewer" allowfullscreen></iframe>
    </div>
  </body>
</html>
